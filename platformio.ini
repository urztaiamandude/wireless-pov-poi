; PlatformIO Project Configuration File
; Nebula Poi - Dual Microcontroller POV System
;
; Teensy 4.1:  Main POV engine (16MB PSRAM, 64GB microSD)
; ESP32-S3:    WiFi/BLE controller (16MB Flash, 8MB PSRAM)
;
; This file builds the Teensy 4.1 only. src_dir is firmware/teensy_firmware.
; Build Teensy:  pio run -e teensy41
; Upload Teensy: pio run -e teensy41 -t upload
;
; ESP32-S3 is a separate PlatformIO project. From firmware/esp32_firmware:
;   pio run -e esp32s3
;   pio run -e esp32s3 -t upload
; Do not add an esp32s3 environment here. It would compile the Teensy sources
; with the ESP32 platform.

[platformio]
default_envs = teensy41
src_dir = firmware/teensy_firmware

; Common settings
[env]
monitor_speed = 115200
extra_scripts = pre:check_forbidden_patterns.py

; ─────────────────────────────────────────────────────────────
; Teensy 4.1 — POV Engine + LED Controller
; Hardware: 16MB PSRAM (2×8MB), 64GB microSD, APA102 32-LED strip
; ─────────────────────────────────────────────────────────────
[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
lib_deps =
    fastled/FastLED@^3.6.0
build_flags =
    -D USB_SERIAL
    -O2
    -Wno-unused-variable
upload_protocol = teensy-gui
