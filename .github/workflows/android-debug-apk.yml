# Debug APK of the Capacitor web UI. assembleDebug uses the Android Gradle
# plugin's automatic debug keystore, so this job has no signing secrets.
#
# npm workspaces hoist dependencies to the repository root, so install with
# `npm ci` from the root. `npx cap sync android` then rewrites the generated
# Gradle includes (capacitor.settings.gradle, capacitor.build.gradle) to those
# hoisted paths and copies capacitor.config.ts into the Android assets. That
# stays valid after PR #206 (androidScheme http, device address) without
# committing the generated Gradle files.
#
# This repository only allows actions owned by urztaiamandude, created by
# GitHub, or verified in the Marketplace, and each one must be pinned to a
# full commit SHA. The Android SDK is installed with sdkmanager for that
# reason. actions/setup-node and actions/setup-java are the setup actions.

name: Android debug APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - "firmware/esp32_firmware/webui/**"
      - ".github/workflows/android-debug-apk.yml"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assemble-debug:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "lts/*"
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Cache Android SDK
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/android-sdk
          key: android-sdk-cmdline-13114758-platform-36-build-tools-35-${{ runner.os }}

      - name: Install Android SDK
        run: |
          set -euo pipefail
          SDK="${RUNNER_TEMP}/android-sdk"
          mkdir -p "$SDK/cmdline-tools"
          if [ ! -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            curl -fsSL -o /tmp/cmdtools.zip \
              https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
            rm -rf /tmp/cmdline-tools
            unzip -q /tmp/cmdtools.zip -d /tmp
            rm -rf "$SDK/cmdline-tools/latest"
            mv /tmp/cmdline-tools "$SDK/cmdline-tools/latest"
          fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          set +o pipefail
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" --licenses >/dev/null
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" \
            --install "platforms;android-36" "build-tools;35.0.0"

      - name: Install npm dependencies
        run: npm ci

      - name: Build web app
        run: npm run webui:build

      - name: Sync Capacitor Android project
        working-directory: firmware/esp32_firmware/webui
        run: npx cap sync android

      - name: Assemble debug APK
        working-directory: firmware/esp32_firmware/webui/android
        run: bash ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pov-poi-debug-apk
          path: firmware/esp32_firmware/webui/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
