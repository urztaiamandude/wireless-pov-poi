; PlatformIO Configuration for ESP32-S3 Firmware
; Board: ESP32-S3-DevKitC-1 N16R8 (16MB Flash, 8MB OPI PSRAM)
; Web UI can be uploaded to SPIFFS from webui/dist via uploadfs.
;
; Platform is pinned to espressif32 6.9.0 (Arduino-ESP32 2.0.17).
; Unpinned builds resolve to 8.x (Arduino-ESP32 3.x), which does not compile
; this firmware: BLE getValue() returns String, MDNS.IP() was renamed,
; the ESP-NOW send callback signature changed, and WiFi pulls in Network.h
; in a way this project does not build.

[platformio]
src_dir = .
data_dir = webui/dist

[env:esp32s3]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
extra_scripts = pre:../../check_forbidden_patterns.py
lib_deps =
    bblanchon/ArduinoJson@^7.2.0
lib_ldf_mode = deep+
monitor_filters =
    esp32_exception_decoder
build_flags =
    -D CORE_DEBUG_LEVEL=3
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D BOARD_HAS_PSRAM
    -D CONFIG_SPIRAM_USE_MALLOC=1
    -D BLE_ENABLED=1
    -I src
board_build.flash_mode = qio
; N16R8: quad flash, octal PSRAM. Without this the board JSON is the no-PSRAM N8.
board_build.arduino.memory_type = qio_opi
board_build.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
board_build.filesystem = spiffs
